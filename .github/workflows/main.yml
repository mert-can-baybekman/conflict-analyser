name: Geopolitical Risk Data Ingestion Pipeline

on:
  schedule:
    # Her gece 00:00 UTC'de otomatik çalışır
    - cron: '0 0 * * *'
  workflow_dispatch:
    # GitHub Actions arayüzünden manuel tetikleme desteği

permissions:
  contents: write

jobs:
  analyze-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Fetch Geopolitical Data (GDELT & World Bank)
        run: |
          python src/fetch_data.py

      - name: Step 2 - Calculate Conflict Risk Model
        run: |
          python src/process_risk.py

      - name: Step 3 - Commit and Push Updated Dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Güncellenen JSON çıktılarını ekle
          git add data/ docs/data/
          
          # Değişiklik varsa commit at ve pushla
          if git diff --staged --quiet; then
            echo "Veri kümesinde yeni bir değişiklik tespit edilmedi. Commit atlanıyor."
          else
            git commit -m "system: geo-risk-bot updated dataset [skip ci]"
            git push origin HEAD:main
          fi
